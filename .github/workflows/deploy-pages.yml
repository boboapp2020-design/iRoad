name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main, claude/friendly-bardeen-33qar9]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # The Apps Script web app URL is public (not a secret). A repository variable
          # (Settings → Secrets and variables → Actions → Variables) overrides it.
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL || 'https://script.google.com/macros/s/AKfycbwLGm8Ju1T9aDQNXdXxmGnLIprtE6Wa_JgL7oFz6LVkRrlZNC-NJlt8PkTF_zFbjJZyZQ/exec' }}
        run: npm run build
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
